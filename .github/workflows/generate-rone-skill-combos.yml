name: Generate Rone skill combos

on:
  push:
    branches:
      - data/skill-combos-rone-import

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Generate skill combos from Rone Arena
        env:
          RONE_BASE: https://arena-hv.fastapicloud.dev/api/heroes
        run: |
          node <<'NODE'
          const fs = require('fs');

          const heroes = JSON.parse(fs.readFileSync('data/heroes.json', 'utf8')).heroes;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function main() {
            const output = {};

            for (let i = 0; i < heroes.length; i++) {
              const hero = heroes[i];
              const url = `${process.env.RONE_BASE}/${encodeURIComponent(hero)}/skill-combos?size=100&index=1&lang=en`;

              const response = await fetch(url, {
                headers: {
                  'User-Agent': 'CounterBro-RoneSkillComboImporter'
                }
              });

              const body = await response.text();

              if (!response.ok) {
                throw new Error(`Rone HTTP ${response.status} for ${hero}: ${body.slice(0, 300)}`);
              }

              const json = JSON.parse(body);

              if (json.code !== 0) {
                throw new Error(`Rone API error for ${hero}: ${body.slice(0, 500)}`);
              }

              const records = Array.isArray(json.data?.records)
                ? json.data.records
                : [];

              output[hero] = {
                heroId: records[0]?.data?.hero_id ?? null,
                totalFromRone: json.data?.total ?? records.length,
                combos: records.slice(0, 2).map(record => ({
                  title: record.data?.title || record.caption || '',
                  description: record.data?.desc || '',
                  skills: (record.data?.skill_id || []).map(skill => ({
                    skillId: skill.data?.skillid ?? null,
                    icon: skill.data?.skillicon || ''
                  }))
                }))
              };

              console.log(`[${i + 1}/${heroes.length}] ${hero}: Rone total=${output[hero].totalFromRone}, saved=${output[hero].combos.length}`);

              // Avoid bursting Rone's upstream.
              await sleep(450);
            }

            fs.writeFileSync(
              'data/skill-combos-es.json',
              JSON.stringify(output, null, 2) + '\n'
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify generated data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const heroes = JSON.parse(fs.readFileSync('data/heroes.json', 'utf8')).heroes;
          const data = JSON.parse(fs.readFileSync('data/skill-combos-es.json', 'utf8'));

          if (Object.keys(data).length !== heroes.length) {
            throw new Error(`Expected ${heroes.length} heroes, got ${Object.keys(data).length}`);
          }

          for (const hero of heroes) {
            if (!data[hero] || !Array.isArray(data[hero].combos) || data[hero].combos.length > 2) {
              throw new Error(`Invalid combo data for ${hero}`);
            }
          }

          console.log(`Verified ${heroes.length} heroes.`);
          NODE

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skill-combos-es.json
          git diff --cached --quiet && exit 0
          git commit -m "data: import Rone Arena skill combos"
          git push
