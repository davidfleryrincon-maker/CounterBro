name: Refresh CounterBro hero catalog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refreshHeroes.js"

permissions:
  contents: write

jobs:
  refresh-heroes:
    name: Refresh static hero catalog from Rone Arena
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh static hero catalog
        run: node scripts/refreshHeroes.js

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- data/heroes.json; then
            echo "No hubo cambios en el catálogo."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/heroes.json
          git commit -m "Refresh CounterBro hero catalog from Rone Arena"
          git push
