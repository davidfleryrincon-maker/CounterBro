name: Refresh CounterBro hero base

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-heroes:
    name: Refresh MLBBHub hero base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --prefix api --no-package-lock

      - name: Refresh prepared hero base
        run: node scripts/refreshHeroes.js

      - name: Commit updated hero base
        run: |
          if git diff --quiet -- api/data/heroes.json; then
            echo "No hubo cambios en la base de héroes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api/data/heroes.json
          git commit -m "Refresh MLBB hero base"
          git push
