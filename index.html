<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CounterBro</title>
  
  <!-- Configuración de Favicon y PWA Icon -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#0b1120">

  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --card-inner: #0f172a;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --gold: #eab308;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card);
      padding: 20px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-logo {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    h2 {
      color: var(--accent);
      margin-top: 10px;
      font-size: 1.4rem;
    }

    .app-subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 6px;
      line-height: 1.3;
    }

    h3 {
      color: var(--accent);
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .step-card {
      background-color: var(--card-inner);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group button {
      width: 35%;
      margin: 0;
    }

    button {
      background: linear-gradient(135deg, var(--accent-dark) 0%, #075985 100%);
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 12px;
      transition: all 0.2s ease;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      margin-top: 15px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      min-height: 28px;
    }

    .tag {
      background: #1e293b;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag span {
      cursor: pointer;
      color: var(--danger);
      font-weight: bold;
    }

    .block-title {
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .block-subtitle {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .item-badge {
      background: #1e293b;
      border-left: 3px solid var(--accent);
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .hero-reason {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.3;
      padding-left: 2px;
    }

    .fuzzy-notice {
      font-size: 0.8rem;
      color: var(--gold);
      margin-top: 4px;
      font-style: italic;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
    }

</head>

  exp: [], mid: [], gold: [], jungle: [], roam: []
};

function guardarPool() {
  localStorage.setItem('mlbb_user_pool', JSON.stringify(userPool));
}

function mostrarPoolActual() {
  const linea = document.getElementById('poolLinea').value;
  const container = document.getElementById('poolTags');
  container.innerHTML = "";
  
  const heroes = userPool[linea] || [];
  if (heroes.length === 0) {

  }

  heroes.forEach((h, index) => {
    container.innerHTML += `<div class="tag">${h} <span onclick="eliminarHeroePool('${linea}', ${index})">&times;</span></div>`;
  });
}

function agregarHeroePool() {
  const linea = document.getElementById('poolLinea').value;
  const input = document.getElementById('nuevoHeroePool');
  const nombreRaw = input.value.trim();
  
  if (nombreRaw) {
    const nombreIdentificado = identificarHeroe(nombreRaw);
    if (!userPool[linea]) userPool[linea] = [];
    if (!userPool[linea].includes(nombreIdentificado)) {
      userPool[linea].push(nombreIdentificado);
      guardarPool();
    }
    mostrarPoolActual();
    input.value = "";
  }
}

function eliminarHeroePool(linea, index) {
  userPool[linea].splice(index, 1);
  guardarPool();
  mostrarPoolActual();
}

function levenshtein(a, b) {
  const tmp = [];
  let i, j;
  for (i = 0; i <= a.length; i++) tmp[i] = [i];
  for (j = 0; j <= b.length; j++) tmp[0][j] = j;

  for (i = 1; i <= a.length; i++) {
    for (j = 1; j <= b.length; j++) {
      tmp[i][j] = a[i - 1] === b[j - 1] 
        ? tmp[i - 1][j - 1] 
        : Math.min(tmp[i - 1][j - 1] + 1, Math.min(tmp[i][j - 1] + 1, tmp[i - 1][j] + 1));
    }
  }
  return tmp[a.length][b.length];
}

// LÓGICA DE IDENTIFICACIÓN CON NORMALIZACIÓN DE SÍMBOLOS Y CARACTERES
function limpiarTexto(str) {
  return str.toLowerCase()
    .replace(/[''\.\-\s]/g, '') // Elimina apóstrofes, puntos, guiones y espacios
    .trim();
}

function identificarHeroe(entrada) {
  if (!entrada) return entrada;
  const limpia = limpiarTexto(entrada);

  // 1. Coincidencia Exacta Limpia
  const coincidenciaExacta = HERO_DATABASE.find(h => limpiarTexto(h) === limpia);
  if (coincidenciaExacta) return coincidenciaExacta;

  // 2. Distancia Levenshtein sobre strings limpios
  let mejorCoincidencia = entrada;
  let menorDistancia = Infinity;

  HERO_DATABASE.forEach(heroe => {
    const distancia = levenshtein(limpia, limpiarTexto(heroe));
    if (distancia < menorDistancia) {
      menorDistancia = distancia;
      mejorCoincidencia = heroe;
    }
  });

  if (menorDistancia <= 2 && limpia.length >= 3) {
    return mejorCoincidencia;
  }

  return entrada;
}

function esHeroeDeLinea(nombreHeroe, linea) {
  const heroesDeLinea = HERO_LANES[linea];
  if (!heroesDeLinea) return true;
  
  // Si el héroe está mapeado en la línea dada
  const enLinea = heroesDeLinea.some(h => limpiarTexto(h) === limpiarTexto(nombreHeroe));
  if (enLinea) return true;

  // Si no está mapeado en NINGUNA línea conocida, asumir true para no descartarlo por error de sincro
  const mapeadoEnAlgunaParte = Object.values(HERO_LANES).some(lista => 
    lista.some(h => limpiarTexto(h) === limpiarTexto(nombreHeroe))
  );

  return !mapeadoEnAlgunaParte;
}

function parseWinRate(wrStr) {
  if (!wrStr) return 0;
  const num = parseFloat(wrStr.replace('%', ''));
  return isNaN(num) ? 0 : num;
}

async function buscarCounter() {
  const linea = document.getElementById('partidaLinea').value;
  const inputEnemigo = document.getElementById('enemigoPick').value.trim();
  
  if (!inputEnemigo) { 
    alert(txt.enterEnemy); 
    return; 
  }

  const enemigoFinal = identificarHeroe(inputEnemigo);
  const pool = userPool[linea] || [];

  document.getElementById('poolResult').innerHTML = "<p style='color:var(--muted); font-size:0.85rem;'>Analizando matchup...</p>";
  document.getElementById('generalResult').innerHTML = "<p style='color:var(--accent); font-size:0.9rem;'>Consultando counters en vivo en MLBB Hub...</p>";
  document.getElementById('resultadosCounter').style.display = "block";

  let fuzzyNotice = (limpiarTexto(enemigoFinal) !== limpiarTexto(inputEnemigo)) 
    ? `<div class="fuzzy-notice">${txt.fuzzyFound} <strong>${enemigoFinal}</strong></div>` 
    : "";

  try {
    const response = await fetch(`${VERCEL_URL}/?hero=${encodeURIComponent(enemigoFinal)}&lane=${encodeURIComponent(linea)}`);
    const data = await response.json();

    const apiCounters = data.counters || [];

    // --- BLOQUE 2: MEJOR OPCIÓN GENERAL ---
    if (apiCounters.length > 0) {
      const countersFiltradosPorLinea = apiCounters.filter(c => esHeroeDeLinea(c.name, linea));
      const listaFinal = countersFiltradosPorLinea.length >= 3 ? countersFiltradosPorLinea : apiCounters;

      let htmlBloque2 = "";
      listaFinal.slice(0, 6).forEach((c, i) => {
        const reasonHtml = c.reason ? `<div class="hero-reason">💡 ${c.reason}</div>` : "";
        htmlBloque2 += `
          <div class="item-badge">
            ${i + 1}. <strong>${c.name}</strong> - Ventaja: ${c.winRate}
            ${reasonHtml}
          </div>`;
      });

      document.getElementById('generalResult').innerHTML = htmlBloque2;
    } else {
      document.getElementById('generalResult').innerHTML = `
        <p style="color:var(--gold); font-size:0.85rem;">No se encontraron counters específicos registrados para <strong>${enemigoFinal}</strong>.</p>`;
    }

    // --- BLOQUE 1: MEJOR OPCIÓN DE TU POOL ---
    if (pool.length === 0) {
      document.getElementById('poolResult').innerHTML = `<p class="empty-msg">${txt.emptyPool}</p>`;
    } else {
      const poolCoincidentes = [];

      pool.forEach(miHeroe => {
        const coincidencia = apiCounters.find(c => limpiarTexto(c.name) === limpiarTexto(miHeroe));
        
        if (coincidencia) {
          poolCoincidentes.push({ 
            name: miHeroe, 
            winRate: coincidencia.winRate,
            wrValue: parseWinRate(coincidencia.winRate),
            reason: coincidencia.reason || null
          });
        }
      });

      // ORDENAR POR VENTAJAS (WIN RATE) DE MAYOR A MENOR
      poolCoincidentes.sort((a, b) => b.wrValue - a.wrValue);

      if (poolCoincidentes.length > 0) {
        let htmlBloque1 = `${fuzzyNotice}`;
        poolCoincidentes.forEach((item) => {
          const reasonHtml = item.reason ? `<div class="hero-reason">💡 ${item.reason}</div>` : "";
          htmlBloque1 += `
            <div class="item-badge" style="border-left-color:var(--success);">
              🥇 <strong>${item.name}</strong> (Ventaja en MLBB Hub: ${item.winRate})
              ${reasonHtml}
            </div>`;
        });
        htmlBloque1 += `<p style="margin-top:6px; font-size:0.85rem; color:var(--success);">¡Opción recomendada! Este personaje de tu pool figura en el meta actual contra ${enemigoFinal}.</p>`;
        document.getElementById('poolResult').innerHTML = htmlBloque1;
      } else {
        document.getElementById('poolResult').innerHTML = `
          ${fuzzyNotice}
          <div style="margin-top:4px;">
            <span style="color:var(--muted); font-size:0.85rem;">Ningún personaje de tu pool tiene un counter directo registrado en MLBB Hub. Tu mejor opción principal guardada para esta línea es:</span><br>
            <strong style="color:var(--gold); font-size:1.1rem; display:inline-block; margin-top:6px;">${pool[0]}</strong>
          </div>`;
      }
    }

  } catch (err) {
    document.getElementById('generalResult').innerHTML = `<p style="color:var(--danger); font-size:0.85rem;">Error al conectar con el servidor de Vercel.</p>`;
    document.getElementById('poolResult').innerHTML = `<p style="color:var(--danger); font-size:0.85rem;">No se pudo procesar la consulta.</p>`;
  }
}

function reiniciarBusqueda() {
  document.getElementById('enemigoPick').value = "";
  document.getElementById('resultadosCounter').style.display = "none";
}

mostrarPoolActual();
</script>
