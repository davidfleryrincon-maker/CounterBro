<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CounterBro - Tu Copiloto en el Draft</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Fuentes eSports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Header Principal -->
    <header class="app-header">
      <div class="logo-badge">CB</div>
      <div>
        <h1>COUNTER<span>BRO</span></h1>
        <p class="tagline">Tu copiloto en la fase de Draft</p>
      </div>
    </header>

    <!-- Panel de Control / Pool de Héroes por Línea -->
    <section class="card pool-section">
      <h2>🛡️ Mi Pool de Héroes por Línea</h2>
      
      <div class="form-grid" style="margin-bottom: 12px;">
        <div class="form-field">
          <label for="selectLineaPool">Selecciona la Línea</label>
          <select id="selectLineaPool">
            <option value="EXP">EXP Lane</option>
            <option value="JUNGLE">Jungla</option>
            <option value="MID">Mid Lane</option>
            <option value="GOLD">Gold Lane</option>
            <option value="ROAM">Roamer</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <input 
          type="text" 
          id="nuevoHeroePool" 
          placeholder="Escribe un héroe para esta línea..." 
          autocomplete="off"
        />
        <button id="btnAgregarHeroe" class="btn-secondary">Agregar</button>
      </div>

      <div id="poolTagsContainer" class="tags-container"></div>
    </section>

    <!-- Panel de Análisis del Matchup -->
    <section class="card analysis-section">
      <h2>⚔️ Análisis de Matchup por Línea</h2>
      
      <div class="form-grid">
        <div class="form-field">
          <label for="enemigoPick">Héroe Enemigo Pickeado</label>
          <input 
            type="text" 
            id="enemigoPick" 
            placeholder="Ej. Suyou, Fanny..." 
            autocomplete="off"
          />
        </div>

        <div class="form-field">
          <label for="selectLineaMatchup">¿En qué línea jugarás?</label>
          <select id="selectLineaMatchup">
            <option value="EXP">EXP Lane</option>
            <option value="JUNGLE">Jungla</option>
            <option value="MID">Mid Lane</option>
            <option value="GOLD">Gold Lane</option>
            <option value="ROAM">Roamer</option>
          </select>
        </div>
      </div>

      <button id="btnAnalizar" class="btn-primary">
        <span>⚡ ANALIZAR MATCHUP Y COUNTERS</span>
      </button>
    </section>

    <!-- Resultados del Análisis (Dividido en dos bloques) -->
    <section id="resultadosSection" class="results-section hidden">
      <h2>📊 Recomendaciones de Counter</h2>

      <!-- Bloque 1: Tu Pool Personal -->
      <div class="card result-card pool-matchup">
        <div class="card-header-badge success-badge">TU MEJOR OPCIÓN (SEGÚN TU POOL)</div>
        <h3 id="tituloPoolCounter">Buscando en tu Pool...</h3>
        <p id="descPoolCounter" class="text-muted"></p>
      </div>

      <!-- Bloque 2: Lista de Counters del Meta por Línea -->
      <div class="card result-card meta-matchup">
        <div class="card-header-badge meta-badge">COUNTERS RECOMENDADOS (MLBBHUB)</div>
        <div id="listaMetaCounters" class="meta-counters-list">
          <!-- Aquí se insertará la lista de counters filtrados por la línea -->
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
