<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CounterBro</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <!-- Icono para dispositivos Apple -->
  <link
    rel="apple-touch-icon"
    href="logo.png"
  >

  <!-- Color del navegador -->
  <meta
    name="theme-color"
    content="#07111F"
  >

  <!-- Hoja de estilos principal -->
  <link
    rel="stylesheet"
    href="styles.css"

</head>

<body>

  <div class="container">

    <!-- =====================================================
         ENCABEZADO Y LOGO
         ===================================================== -->

    <div class="header">

      <img
        src="logo.png"
        alt="Logo CounterBro"
        class="app-logo"
        onerror="this.style.display='none'"
      >

      <h2>CounterBro</h2>

      <p class="app-subtitle">
        Asistente táctico de picks y counters en tiempo real.
      </p>

    </div>


    <!-- =====================================================
         PASO 1: POOL PERSONAL
         ===================================================== -->

    <div class="step-card">

      <h3 id="t-step1">
        1. Configurar tu Pool de Héroes
      </h3>

      <label
        id="t-selectLane"
        class="lane-section-label"
      >
        Seleccionar Línea:
      </label>

      <div
        class="lane-selector"
        role="group"
        aria-label="Seleccionar línea para tu pool"
      >

        <button
          type="button"
          class="lane-option is-active"
          data-lane-group="pool"
          data-lane="exp"
          onclick="seleccionarLinea('pool', 'exp')"
        >
          <span class="lane-icon">⚔️</span>
          <span class="lane-name">EXP</span>
          <span class="lane-hint">Fighter</span>
        </button>

        <button
          type="button"
          class="lane-option"
          data-lane-group="pool"
          data-lane="mid"
          onclick="seleccionarLinea('pool', 'mid')"
        >
          <span class="lane-icon">🔮</span>
          <span class="lane-name">MID</span>
          <span class="lane-hint">Mage</span>
        </button>

        <button
          type="button"
          class="lane-option"
          data-lane-group="pool"
          data-lane="gold"
          onclick="seleccionarLinea('pool', 'gold')"
        >
          <span class="lane-icon">🏹</span>
          <span class="lane-name">GOLD</span>
          <span class="lane-hint">Marksman</span>
        </button>

        <button
          type="button"
          class="lane-option"
          data-lane-group="pool"
          data-lane="jungle"
          onclick="seleccionarLinea('pool', 'jungle')"
        >
          <span class="lane-icon">🗡️</span>
          <span class="lane-name">JUNGLE</span>
          <span class="lane-hint">Assassin</span>
        </button>

        <button
          type="button"
          class="lane-option"
          data-lane-group="pool"
          data-lane="roam"
          onclick="seleccionarLinea('pool', 'roam')"
        >
          <span class="lane-icon">🛡️</span>
          <span class="lane-name">ROAM</span>
          <span class="lane-hint">Support</span>
        </button>

      </div>

      <!-- Selector interno conservado para mantener la lógica actual -->
      <select
        id="poolLinea"
        class="lane-native-select"
        onchange="mostrarPoolActual()"
        aria-hidden="true"
        tabindex="-1"
      >
        <option value="exp">EXP Lane</option>
        <option value="mid">MID Lane</option>
        <option value="gold">GOLD Lane</option>
        <option value="jungle">JUNGLE</option>
        <option value="roam">ROAM</option>
      </select>


      <label id="t-addHero">
        Agregar héroe a esta línea:
      </label>

      <div class="input-group">

        <input
          type="text"
          id="nuevoHeroePool"
          placeholder="Ej: Paquito, Chou..."
        >

        <button
          onclick="agregarHeroePool()"
          id="t-btnAdd"
        >
          Agregar
        </button>

      </div>

      <div
        class="hero-tags"
        id="poolTags"
      ></div>

    </div>

         PASO 2: BÚSQUEDA DE COUNTER

          data-lane-group="match"

        </button>

      <!-- Selector interno conservado para mantener la lógica actual -->
      <select
        id="partidaLinea"
        class="lane-native-select"
        aria-hidden="true"
        tabindex="-1"
      >

        <option value="mid">MID Lane</option>
        <option value="gold">GOLD Lane</option>
        <option value="jungle">JUNGLE</option>

    </div>

    function seleccionarLinea(grupo, linea) {

      const selectId =
        grupo === 'pool'
          ? 'poolLinea'
          : 'partidaLinea';

      const select =
        document.getElementById(selectId);

      if (!select) {
        return;
      }

      select.value = linea;

      document
        .querySelectorAll(
          `.lane-option[data-lane-group="${grupo}"]`

        .forEach(button => {

          button.classList.toggle(
            'is-active',
            button.dataset.lane === linea
          );

        });

      if (grupo === 'pool') {
        mostrarPoolActual();
      }

    }


    function sincronizarSelectoresDeLinea() {

      const poolLinea =
        document.getElementById('poolLinea')?.value || 'exp';

      document
        .querySelectorAll(
          '.lane-option[data-lane-group="pool"]'
        )
        .forEach(button => {

          button.classList.toggle(
            'is-active',
            button.dataset.lane === poolLinea
          );

        });

      document
        .querySelectorAll(
          '.lane-option[data-lane-group="match"]'
        )
        .forEach(button => {

          button.classList.toggle(
            'is-active',
            button.dataset.lane === partidaLinea

    function mostrarPoolActual() {

      const linea =
        document.getElementById('poolLinea').value;

      const container =
        document.getElementById('poolTags');

      container.innerHTML = "";


      const heroes =
        userPool[linea] || [];


      if (heroes.length === 0) {

        container.innerHTML =
          `<span class="empty-msg">${txt.emptyPool}</span>`;

        return;

      }


      heroes.forEach(
        (h, index) => {

          container.innerHTML +=
            `<div class="tag">
              ${h}
              <span onclick="eliminarHeroePool('${linea}', ${index})">
                &times;
              </span>
            </div>`;

        }
      );

    }


    function agregarHeroePool() {

      const linea =
        document.getElementById('poolLinea').value;

      const input =
        document.getElementById('nuevoHeroePool');

      const nombreRaw =
        input.value.trim();


      if (nombreRaw) {

        const nombreIdentificado =
          identificarHeroe(nombreRaw);


        if (!userPool[linea]) {
          userPool[linea] = [];
        }


        if (
          !userPool[linea].includes(
            nombreIdentificado
          )
        ) {

          userPool[linea].push(
            nombreIdentificado
          );

          guardarPool();

        }


        mostrarPoolActual();

        input.value = "";

      }

    }


    function eliminarHeroePool(
      linea,
      index
    ) {

      userPool[linea].splice(
        index,
        1
      );

      guardarPool();

      mostrarPoolActual();

    }


    /* =======================================================
       LEVENSHTEIN
       ======================================================= */

    function levenshtein(a, b) {

      const tmp = [];

      let i;
      let j;


      for (
        i = 0;
        i <= a.length;
        i++
      ) {

        tmp[i] = [i];

      }


      for (
        j = 0;
        j <= b.length;
        j++
      ) {

        tmp[0][j] = j;

      }


      for (
        i = 1;
        i <= a.length;
        i++
      ) {

        for (
          j = 1;
          j <= b.length;
          j++
        ) {

          tmp[i][j] =
            a[i - 1] === b[j - 1]

              ? tmp[i - 1][j - 1]

              : Math.min(
                  tmp[i - 1][j - 1] + 1,
                  Math.min(
                    tmp[i][j - 1] + 1,
                    tmp[i - 1][j] + 1
                  )
                );

        }

      }


      return tmp[a.length][b.length];

    }


    /* =======================================================
       NORMALIZACIÓN DE TEXTO
       ======================================================= */

    function limpiarTexto(str) {

      return str
        .toLowerCase()
        .replace(
          /[''\.\-\s]/g,
          ''
        )
        .trim();

    }


    function identificarHeroe(entrada) {

      if (!entrada) {
        return entrada;
      }


      const limpia =
        limpiarTexto(entrada);


      /* Coincidencia exacta */

      const coincidenciaExacta =
        HERO_DATABASE.find(
          h =>
            limpiarTexto(h) === limpia
        );


      if (coincidenciaExacta) {

        return coincidenciaExacta;

      }


      /* Distancia Levenshtein */

      let mejorCoincidencia =
        entrada;

      let menorDistancia =
        Infinity;


      HERO_DATABASE.forEach(
        heroe => {

          const distancia =
            levenshtein(
              limpia,
              limpiarTexto(heroe)
            );


          if (
            distancia <
            menorDistancia
          ) {

            menorDistancia =
              distancia;

            mejorCoincidencia =
              heroe;

          }

        }
      );


      if (
        menorDistancia <= 2 &&
        limpia.length >= 3
      ) {

        return mejorCoincidencia;

      }


      return entrada;

    }


    /* =======================================================
       VALIDAR HÉROE POR LÍNEA
       ======================================================= */

    function esHeroeDeLinea(
      nombreHeroe,
      linea
    ) {

      const heroesDeLinea =
        HERO_LANES[linea];


      if (!heroesDeLinea) {
        return true;
      }


      const enLinea =
        heroesDeLinea.some(
          h =>
            limpiarTexto(h) ===
            limpiarTexto(nombreHeroe)
        );


      if (enLinea) {
        return true;
      }


      const mapeadoEnAlgunaParte =
        Object.values(HERO_LANES)
          .some(
            lista =>
              lista.some(
                h =>
                  limpiarTexto(h) ===
                  limpiarTexto(nombreHeroe)
              )
          );


      return !mapeadoEnAlgunaParte;

    }


    /* =======================================================
       WIN RATE
       ======================================================= */

    function parseWinRate(wrStr) {

      if (!wrStr) {
        return 0;
      }


      const num =
        parseFloat(
          wrStr.replace('%', '')
        );


      return isNaN(num)
        ? 0
        : num;

    }


    /* =======================================================
       BUSCAR COUNTER
       ======================================================= */

    async function buscarCounter() {

      const linea =
        document.getElementById(
          'partidaLinea'
        ).value;


      const inputEnemigo =
        document.getElementById(
          'enemigoPick'
        ).value.trim();


      if (!inputEnemigo) {

        alert(
          txt.enterEnemy
        );

        return;

      }


      const enemigoFinal =
        identificarHeroe(
          inputEnemigo
        );


      const pool =
        userPool[linea] || [];


      document.getElementById(
        'poolResult'
      ).innerHTML =
        "<p style='color:var(--muted); font-size:0.85rem;'>Analizando matchup...</p>";


      document.getElementById(
        'generalResult'
      ).innerHTML =
        "<p style='color:var(--accent); font-size:0.9rem;'>Consultando counters en vivo en MLBB Hub...</p>";


      document.getElementById(
        'resultadosCounter'
      ).style.display =
        "block";


      let fuzzyNotice =
        (
          limpiarTexto(enemigoFinal) !==
          limpiarTexto(inputEnemigo)
        )

          ? `<div class="fuzzy-notice">
               ${txt.fuzzyFound}
               <strong>${enemigoFinal}</strong>
             </div>`

          : "";


      try {

        const response =
          await fetch(
            `${VERCEL_URL}/?hero=${encodeURIComponent(enemigoFinal)}&lane=${encodeURIComponent(linea)}`
          );


        const data =
          await response.json();


        const apiCounters =
          data.counters || [];


        /* =================================================
           BLOQUE 2:
           MEJOR OPCIÓN GENERAL
           ================================================= */

        if (
          apiCounters.length > 0
        ) {

          const countersFiltradosPorLinea =
            apiCounters.filter(
              c =>
                esHeroeDeLinea(
                  c.name,
                  linea
                )
            );


          const listaFinal =
            countersFiltradosPorLinea.length >= 3
              ? countersFiltradosPorLinea
              : apiCounters;


          let htmlBloque2 =
            "";


          listaFinal
            .slice(0, 6)
            .forEach(
              (c, i) => {

                const reasonHtml =
                  c.reason

                    ? `<div class="hero-reason">
                         💡 ${c.reason}
                       </div>`

                    : "";


                htmlBloque2 +=
                  `
                  <div class="item-badge">

                    ${i + 1}.
                    <strong>${c.name}</strong>
                    - Ventaja: ${c.winRate}

                    ${reasonHtml}

                  </div>
                  `;

              }
            );


          document.getElementById(
            'generalResult'
          ).innerHTML =
            htmlBloque2;

        } else {

          document.getElementById(
            'generalResult'
          ).innerHTML =
            `
            <p style="color:var(--gold); font-size:0.85rem;">

              No se encontraron counters específicos
              registrados para
              <strong>${enemigoFinal}</strong>.

            </p>
            `;

        }


        /* =================================================
           BLOQUE 1:
           MEJOR OPCIÓN DEL POOL
           ================================================= */

        if (pool.length === 0) {

          document.getElementById(
            'poolResult'
          ).innerHTML =
            `
            <p class="empty-msg">
              ${txt.emptyPool}
            </p>
            `;

        } else {

          const poolCoincidentes =
            [];


          pool.forEach(
            miHeroe => {

              const coincidencia =
                apiCounters.find(
                  c =>
                    limpiarTexto(c.name) ===
                    limpiarTexto(miHeroe)
                );


              if (coincidencia) {

                poolCoincidentes.push({

                  name:
                    miHeroe,

                  winRate:
                    coincidencia.winRate,

                  wrValue:
                    parseWinRate(
                      coincidencia.winRate
                    ),

                  reason:
                    coincidencia.reason ||
                    null

                });

              }

            }
          );


          /* Ordenar por ventaja */

          poolCoincidentes.sort(
            (a, b) =>
              b.wrValue -
              a.wrValue
          );


          if (
            poolCoincidentes.length > 0
          ) {

            let htmlBloque1 =
              `${fuzzyNotice}`;


            poolCoincidentes.forEach(
              item => {

                const reasonHtml =
                  item.reason

                    ? `<div class="hero-reason">
                         💡 ${item.reason}
                       </div>`

                    : "";


                htmlBloque1 +=
                  `
                  <div
                    class="item-badge"
                    style="border-left-color:var(--success);"
                  >

                    🥇
                    <strong>${item.name}</strong>

                    (Ventaja en MLBB Hub:
                    ${item.winRate})

                    ${reasonHtml}

                  </div>
                  `;

              }
            );


            htmlBloque1 +=
              `
              <p
                style="
                  margin-top:6px;
                  font-size:0.85rem;
                  color:var(--success);
                "
              >

                ¡Opción recomendada!
                Este personaje de tu pool figura
                en el meta actual contra
                ${enemigoFinal}.

              </p>
              `;


            document.getElementById(
              'poolResult'
            ).innerHTML =
              htmlBloque1;

          } else {

            document.getElementById(
              'poolResult'
            ).innerHTML =
              `
              ${fuzzyNotice}

              <div style="margin-top:4px;">

                <span
                  style="
                    color:var(--muted);
                    font-size:0.85rem;
                  "
                >

                  Ningún personaje de tu pool
                  tiene un counter directo registrado
                  en MLBB Hub.

                  Tu mejor opción principal guardada
                  para esta línea es:

                </span>

                <br>

                <strong
                  style="
                    color:var(--gold);
                    font-size:1.1rem;
                    display:inline-block;
                    margin-top:6px;
                  "
                >

                  ${pool[0]}

                </strong>

              </div>
              `;

          }

        }


      } catch (err) {

        document.getElementById(
          'generalResult'
        ).innerHTML =
          `
          <p
            style="
              color:var(--danger);
              font-size:0.85rem;
            "
          >

            Error al conectar con el
            servidor de Vercel.

          </p>
          `;


        document.getElementById(
          'poolResult'
        ).innerHTML =
          `
          <p
            style="
              color:var(--danger);
              font-size:0.85rem;
            "
          >

            No se pudo procesar la consulta.

          </p>
          `;

      }

    }


    /* =======================================================
       REINICIAR BÚSQUEDA
       ======================================================= */

    function reiniciarBusqueda() {

      document.getElementById(
        'enemigoPick'
      ).value = "";


      document.getElementById(
        'resultadosCounter'
      ).style.display =
        "none";

    }


    /* =======================================================
       INICIALIZACIÓN
       ======================================================= */

    sincronizarSelectoresDeLinea();
    mostrarPoolActual();

  </script>
