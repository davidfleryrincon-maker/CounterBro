 <style>
  #leg-0,#leg-2{transform-box:fill-box;transform-origin:center;animation:stepA .34s steps(2,end) infinite alternate}
  #leg-1,#leg-3{transform-box:fill-box;transform-origin:center;animation:stepB .34s steps(2,end) infinite alternate}
  #tail-walk{transform-box:fill-box;transform-origin:5% 50%;animation:tailSwing .34s ease-in-out infinite alternate}
  @keyframes stepA{from{transform:translate(-2px,-1px)}to{transform:translate(2px,1px)}}
  @keyframes stepB{from{transform:translate(2px,1px)}to{transform:translate(-2px,-1px)}}
  @keyframes tailSwing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  </style></svg>