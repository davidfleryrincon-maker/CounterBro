<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
<style>
@keyframes frontA{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-3px)}50%{transform:translate(5px,0)}75%{transform:translate(1px,2px)}}
@keyframes frontB{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(-5px,0)}75%{transform:translate(-1px,-3px)}}
@keyframes tail{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg)}}
@keyframes head{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.leg-a{animation:frontA .55s steps(2,end) infinite;transform-box:fill-box;transform-origin:top center}
.leg-b{animation:frontB .55s steps(2,end) infinite;transform-box:fill-box;transform-origin:top center}
.tail{animation:tail .8s steps(2,end) infinite;transform-box:fill-box;transform-origin:left center}
.head{animation:head .55s steps(2,end) infinite}
@media(prefers-reduced-motion:reduce){.leg-a,.leg-b,.tail,.head{animation:none}}
</style>
<g stroke="#28134f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<g class="tail">
 <path fill="#8d52d9" d="M82 72h13V62h10V49h-8V39h8V31h9v8h8v13h-8v11h-8v10h-9v8H82z"/>
 <path fill="#b984ff" d="M105 34h8v7h7v10h-7v10h-8v8h-8v-8h8V50h-8v-8h8z"/>
</g>
<!-- legs behind body: independent visible limbs with toes -->
<g class="leg-a" fill="#7c42c7">
 <path d="M79 74h10v8h-3v9h-7v-8h1z"/><path d="M78 89h7v4h7v4H80v-4h-4z" fill="#d9b4ff" stroke="none"/>
</g>
<g class="leg-b" fill="#7c42c7">
 <path d="M45 74h10v8h-3v9h-7v-8h1z"/><path d="M44 89h7v4h7v4H46v-4h-4z" fill="#d9b4ff" stroke="none"/>
</g>
<path fill="#8d52d9" d="M25 68h8V57h11V49h22V45h16v7h10v8h8v12H88v8H69v5H47v-5H35v-6h-10z"/>
<path fill="#a96bf0" d="M43 57h12v-6h13v7H56v7H43zM68 55h13v7H68zM57 69h15v6H57z"/>
<path fill="#c99aff" stroke="none" d="M45 62h8v4h-8zM65 65h8v4h-8zM78 58h6v4h-6zM51 75h8v4h-8z"/>
<g class="leg-b" fill="#a96bf0">
 <path d="M35 72h10v9h-4v9h-7v-8h1z"/><path d="M32 88h7v4h7v4H34v-4h-4z" fill="#d9b4ff" stroke="none"/>
</g>
<g class="leg-a" fill="#a96bf0">
 <path d="M65 72h10v9h-4v9h-7v-8h1z"/><path d="M63 88h7v4h7v4H65v-4h-4z" fill="#d9b4ff" stroke="none"/>
</g>
<g class="head">
 <path fill="#a96bf0" d="M17 58h8V49h10V41h20v5h10v8h7v15H64v8H44v-4H31v-5h-9v-5h-5z"/>
 <path fill="#c99aff" stroke="none" d="M30 48h8v4h-8zM43 45h8v4h-8zM24 57h7v4h-7z"/>
 <path fill="#28134f" d="M39 49h12v4h4v12h-4v4H39v-4h-4V53h4z"/>
 <path fill="#fff7ff" d="M39 52h8v8h-8z"/><path fill="#28134f" stroke="none" d="M43 56h4v4h-4z"/>
 <path fill="#fff7ff" d="M58 56h5v5h-5z"/><path fill="#28134f" stroke="none" d="M60 58h3v3h-3z"/>
 <path fill="none" stroke="#4a2177" stroke-width="2" d="M27 67h7v3h7"/>
</g>
</g></svg>