<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 128" shape-rendering="crispEdges">
<style>
@keyframes legFront{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-3px)}}
@keyframes legBack{0%,100%{transform:translate(0,0)}50%{transform:translate(-2px,2px)}}
@keyframes tailMove{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes bodyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.front{animation:legFront .34s steps(2,end) infinite;transform-box:fill-box;transform-origin:top center}
.back{animation:legBack .34s steps(2,end) infinite;transform-box:fill-box;transform-origin:top center}
.tail{animation:tailMove .8s steps(2,end) infinite;transform-box:fill-box;transform-origin:20% 80%}
.body{animation:bodyBob .8s steps(2,end) infinite}
@media(prefers-reduced-motion:reduce){.front,.back,.tail,.body{animation:none}}
</style>
<!-- soft pixel shadow beneath feet and belly -->
<ellipse cx="101" cy="109" rx="66" ry="7" fill="#090613" opacity=".78"/>
<path d="M48 106h20v-3h22v3h38v3H48z" fill="#24113c" opacity=".8"/>
<!-- tail curls up from the rump and tapers to a rounded tip -->
<g class="tail" stroke="#35145d" stroke-width="3" stroke-linejoin="round">
 <path fill="#7d35c5" d="M68 76H51V72H39V65H31V53H34V42H39V32H46V25H57V28H64V35H57V39H51V47H47V57H51V64H61V68H75V72H83V78H68Z"/>
 <path fill="#a957ed" stroke="none" d="M38 51V41H43V33H50V29H57V32H62V35H55V39H50V47H46V58H50V64H59V68H70V72H61V69H50V65H43V59H39V51Z"/>
 <path fill="#d39aff" stroke="none" d="M40 43h4v-7h6v-4h7v4h-7v5h-5v9h-4zM44 57h5v6h7v4h-7v-3h-5z"/>
 <path fill="#c17afa" stroke="none" d="M50 49h5v5h-5zM54 59h5v5h-5zM61 66h5v4h-5z"/>
</g>
<!-- far-side feet, visibly splayed with toe pads -->
<g class="back" stroke="#35145d" stroke-width="3" stroke-linejoin="round">
 <path fill="#7836bc" d="M78 77h11v9h-4v9h-7v-8h-4z"/>
 <path fill="#ad62e8" d="M78 93h6v4h7v3h-5v4h-4v-4h-5v-3h-4v-3h5z"/>
 <path fill="#7836bc" d="M127 78h11v8h-4v9h-7v-8h-4z"/>
 <path fill="#ad62e8" d="M126 93h6v4h7v3h-5v4h-4v-4h-5v-3h-4v-3h5z"/>
</g>
<!-- main torso: elongated, gently arched back and pale belly -->
<g class="body">
 <path fill="#6e2cb4" stroke="#35145d" stroke-width="4" stroke-linejoin="round" d="M49 70H62V62H78V57H99V60H119V65H136V72H148V82H141V91H126V97H97V94H79V88H62V83H49Z"/>
 <path fill="#a957e8" stroke="none" d="M56 70h10v-7h13v-4h19v4h17v5h15v7h11v7h-9v6h-16v5H98v-4H81v-6H65v-4H56z"/>
 <path fill="#d69cff" stroke="none" d="M69 66h11v-4h11v4H80v4H69zM94 64h9v4h-9zM115 70h10v4h-10z"/>
 <path fill="#e2baff" stroke="none" d="M69 78h8v4h-8zM86 73h6v4h-6zM103 81h8v4h-8zM123 78h6v4h-6zM93 88h8v3h-8z"/>
 <path fill="#7130b0" stroke="none" d="M66 84h16v4h17v4h28v-4h-16v-4H92v-3H77v3z"/>
 <!-- scattered gecko spots -->
 <path fill="#efcfff" stroke="none" d="M78 68h4v4h-4zM91 63h4v4h-4zM108 69h4v4h-4zM119 76h4v4h-4zM84 81h4v4h-4zM101 86h4v4h-4z"/>
</g>
<!-- near legs: bent, articulated, with distinct sticky toes -->
<g class="front" stroke="#35145d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
 <path fill="#a957e8" d="M66 78H78V85H74V94H67V88H63V83H66Z"/>
 <path fill="#c47bf4" d="M66 92h6v4h7v3h-5v4h-4v-4h-5v-3h-4v-3h5z"/>
 <path fill="#a957e8" d="M111 83h12v7h-4v8h-7v-7h-4z"/>
 <path fill="#c47bf4" d="M110 96h6v4h7v3h-5v4h-4v-4h-5v-3h-4v-3h5z"/>
</g>
<!-- head, broad at the back, rounded crown, defined snout -->
<path fill="#6f2cb4" stroke="#35145d" stroke-width="4" stroke-linejoin="round" d="M19 65V52H24V42H33V34H46V30H62V35H73V41H80V51H87V61H81V68H68V73H48V69H35V66H24V65Z"/>
<path fill="#a958ed" stroke="none" d="M24 54V44H33V37H46V34H60V38H70V43H76V52H82V59H77V64H65V69H48V65H34V62H25V54Z"/>
<path fill="#d49aff" stroke="none" d="M31 43h8v-5h9v4h-9v5h-8zM49 36h9v4h-9zM25 53h6v5h-6z"/>
<!-- large glossy eye with a dark vertical slit -->
<path fill="#42166e" stroke="#35145d" stroke-width="3" d="M43 39H57V43H62V57H57V62H43V57H39V43H43Z"/>
<path fill="#fff2d9" stroke="none" d="M44 42h10v14H44z"/>
<path fill="#21102e" stroke="none" d="M49 42h5v14h-5z"/>
<path fill="#ffffff" stroke="none" d="M44 43h4v4h-4zM54 54h3v3h-3z"/>
<!-- second eye peeking over the far side of the head -->
<path fill="#42166e" stroke="#35145d" stroke-width="2" d="M65 43h8v3h3v8h-3v3h-8v-3h-3v-8h3z"/>
<path fill="#fff2d9" stroke="none" d="M66 46h5v5h-5z"/>
<path fill="#21102e" stroke="none" d="M69 46h2v5h-2z"/>
<!-- nostrils, cheek and curious smile -->
<path fill="#55217e" stroke="none" d="M76 58h3v3h-3zM70 61h3v3h-3z"/>
<path fill="none" stroke="#4c1c72" stroke-width="2" d="M62 65h7v-2h7"/>
</svg>