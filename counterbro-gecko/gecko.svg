<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" shape-rendering="crispEdges">
<style>
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.body{animation:bounce .85s steps(2,end) infinite}.tail{animation:tail .9s steps(2,end) infinite;transform-box:fill-box;transform-origin:10% 85%}.legs{animation:step .28s steps(2,end) infinite;transform-box:fill-box;transform-origin:top center}
@media(prefers-reduced-motion:reduce){.body,.tail,.legs{animation:none}}
</style>
