<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112" shape-rendering="crispEdges">
<style>
@keyframes step1{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-5px)}}
@keyframes step2{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,2px)}}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.leg1{animation:step1 .3s steps(2,end) infinite;transform-box:fill-box;transform-origin:top center}
.leg2{animation:step2 .3s steps(2,end) infinite;transform-box:fill-box;transform-origin:top center}
.tail{animation:tail .65s steps(2,end) infinite;transform-box:fill-box;transform-origin:left center}
.body{animation:idle .45s steps(2,end) infinite}
@media(prefers-reduced-motion:reduce){.leg1,.leg2,.tail,.body{animation:none}}
</style>
<g stroke="#28134f" stroke-width="3" stroke-linejoin="round">
<g class="tail"><path fill="#8d52d9" d="M111 66h12V54h10V40h-8V28h9V19h10v10h8v13h-8v12h-8v12h-12v8h-13z"/><path fill="#b984ff" d="M134 23h7v8h7v9h-7v11h-8v8h-7v-8h7V40h-7v-7h8z"/></g>
<g class="leg2" fill="#7c42c7"><path d="M105 68h12v9h-4v11h-8v-8z"/><path d="M103 86h9v5h9v5h-15v-5h-4z" fill="#d9b4ff" stroke="none"/></g>
<g class="leg1" fill="#7c42c7"><path d="M60 68h12v9h-4v11h-8v-8z"/><path d="M58 86h9v5h9v5H61v-5h-4z" fill="#d9b4ff" stroke="none"/></g>
<g class="body">
<path fill="#8d52d9" d="M31 62h10V50h13V42h25V38h22v7h13v9h9v13h-9v10h-21v6H65v-5H48v-7H31z"/>
<path fill="#b984ff" d="M53 48h15v-5h14v7H68v7H53zM81 48h15v7H81zM70 63h17v6H70z"/>
<path fill="#d9b4ff" stroke="none" d="M57 57h8v4h-8zM81 60h8v4h-8zM95 51h7v4h-7z"/>
</g>
<g class="leg1" fill="#a96bf0"><path d="M40 69h12v9h-4v10h-8v-8z"/><path d="M37 85h9v5h9v5H40v-5h-5z" fill="#d9b4ff" stroke="none"/></g>
<g class="leg2" fill="#a96bf0"><path d="M76 73h12v9h-4v10h-8v-8z"/><path d="M73 89h9v5h9v5H76v-5h-5z" fill="#d9b4ff" stroke="none"/></g>
<path fill="#a96bf0" d="M14 52h9V41h12V31h21v5h11v8h8v17H65v8H43v-4H29v-5H17z"/>
<path fill="#d0a2ff" stroke="none" d="M29 39h8v4h-8zM43 35h8v4h-8zM21 50h8v4h-8z"/>
<!-- large glossy gecko eye -->
<path fill="#28134f" d="M39 39h14v4h5v15h-5v5H39v-5h-5V43h5z"/>
<path fill="#fff7ff" d="M39 42h9v9h-9z"/><path fill="#6f39b6" stroke="none" d="M44 47h4v4h-4z"/><path fill="#fff" stroke="none" d="M40 42h3v3h-3z"/>
<!-- little second eye and smile -->
<path fill="#fff7ff" d="M61 46h6v6h-6z"/><path fill="#28134f" stroke="none" d="M63 48h4v4h-4z"/>
<path fill="none" stroke="#4a2177" stroke-width="2" d="M23 59h8v3h8"/>
</g></svg>